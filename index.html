.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;margin-bottom:6px}

.mbox li{break-inside:avoid;position:relative;padding:9px 0 9px 24px;margin:0;border-bottom:1px solid #e8ecf6;line-height:1.5}
.mbox li:before{content:"";position:absolute;left:2px;top:17px;width:9px;height:9px;background:var(--red);border-radius:2px}

ru:[
[["Монтаж промышленного оборудования – это комплекс работ, объединяющий сборку, установку и подключение различных видов техники. Наши мастера могут монтировать как отдельные установки, так и полноценные технологические линии, проводить пуско-наладку и последующее обслуживание.","Процесс монтажа оборудования включает в себя различные этапы: размещение оборудования, установку и подключение проводов, подключение электрических компонентов, установку программного обеспечения, настройку параметров и проверку работоспособности агрегатов.","Наши опытные специалисты своевременно и качественно произведут монтаж и наладку вашего оборудования.","А также:"],["Технологичные продукты за фиксированный срок","Проведение исследований","Обратный инжиниринг","Помощь в сборе и аналитике данных вашего оборудования","Обсудим вашу идею или продукт","Подскажем как лучше не делать","Расскажем как сделать высоконагруженное производство за вменяемый бюджет","Мы всегда на связи! Даже когда проект реализован","Мы отвечаем на ваши вопросы очень быстро","У нас огромный опыт и много наработок."],[]],
[["Промышленному сектору особенно нужны хорошие программисты: на заводах множество машин, установок, насосов и трубопроводов, и для всего этого создаются системы управления и контроля безопасности. Оператору достаточно нажать кнопку, чтобы получить данные с нескольких тысяч датчиков.","Основной опыт связан с контроллерами SIEMENS и OMRON, также работали с DELTA, OWEN, GMT, ABB, SCHNEIDER ELECTRIC, DANFOSS, MITSUBISHI ELECTRIC. Разрабатываем ПО с чистого листа и на основе существующих прошивок, проектируем HMI. Для отладки используем стенд (64 цифровых входа, 64 выхода, 16 аналоговых каналов) и лицензионное ПО: TIA Portal, Simatic Manager, STEP 5 и другое."],[],["Готовы оказать услуги по разработке, интеграции и поставке систем управления для ваших технологических установок."]],
[["Собираем щиты и шкафы управления автоматики, в том числе для вентиляции и кондиционирования, котельных, насосных станций и систем электроснабжения. В щитах устанавливается аварийная сигнализация и системы предупреждения внештатных ситуаций."],["Разработка ТЗ и подбор комплектующих","Монтажные и пусконаладочные работы","Помощь в сдаче контролирующим органам","Гарантийное и постгарантийное обслуживание","Поставка всех компонентов по оптимальной стоимости"],["Работаем в тесной связке с заказчиком, учитывая все его пожелания."]],
[["При обновлении или перераспределении производственных мощностей оборудование нужно демонтировать безопасно и без перерасхода бюджета. Мы определяем глубину демонтажа с учётом транспортировки и сроков ввода мощностей в эксплуатацию."],["Планируем последовательность операций, чтобы сократить простой производства","Маркируем узлы, кабели и элементы трубопроводов","Упаковываем элементы на период перевозки или консервации","Соблюдаем стандарты безопасности"],[]],
[["Ревизия — это комплекс операций по установлению степени износа оборудования или его частей, проверке работоспособности, безопасности и надёжности узлов и деталей.","Периодическая ревизия и наладка оборудования, электроприводов и автоматики обеспечивает непрерывность вашего производства, помогает вовремя выявлять неисправности и значительно продлевает срок службы."],[],[]],
[["Модернизация — это изменения и усовершенствования, повышающие производительность, точность, безопасность и удобство обслуживания оборудования. Это способ продлить жизнь отслужившему станку, когда покупка нового не по карману. Затрагивает механику, пневмо- и гидросистемы и систему автоматического управления.","Предлагаем комплексный подход или модернизацию отдельных элементов: разрабатываем новую систему управления или дорабатываем существующую на современном оборудовании."],[],[]],
[["Специализируемся на ремонте на компонентном уровне: восстановление плат после коррозии, механического и термического воздействия, замена дискретных элементов, микросхем, вентиляторов, трансформаторов. Ремонтируем частотные преобразователи, сервоприводы, контроллеры, панели управления и блоки питания."],["Замена и восстановление IGBT и выпрямительных модулей","Восстановление каналов управления","Чистка узлов и блоков с полной разборкой","Параметризация, восстановление рабочих настроек","Пусконаладка","Восстановление дорожек и переходных отверстий"],["Авторизованный сервисный партнёр Danfoss, WEG, Vacon, Omron в России и Siemens, Schneider Electric в Турции. Работаем только с юридическими лицами."]]
],
en:[
[["Installation of industrial equipment is a set of works combining assembly, installation and connection of various machinery. Our technicians can install both individual units and complete production lines, and carry out commissioning and subsequent service.","The process includes several stages: placing the equipment, installing and connecting wiring, connecting electrical components, installing software, setting parameters and testing the units.","Our experienced specialists will install and commission your equipment on time and with quality.","We also offer:"],["Technology products delivered by a fixed deadline","Research","Reverse engineering","Help with collecting and analyzing your equipment data","We will discuss your idea or product","We will advise what is better not to do","We will show how to build a high-load production on a reasonable budget","We are always in touch, even after the project is done","We answer your questions very quickly","We have vast experience and many developments."],[]],
[["The industrial sector especially needs good programmers: plants have many machines, units, pumps and pipelines, and all of them need control and safety systems. An operator just presses a button to get data from thousands of sensors.","Our main experience is with SIEMENS and OMRON controllers; we have also worked with DELTA, OWEN, GMT, ABB, SCHNEIDER ELECTRIC, DANFOSS and MITSUBISHI ELECTRIC. We develop software from scratch or on top of existing firmware and design HMI. For debugging we use a test bench (64 digital inputs, 64 outputs, 16 analog channels) and licensed software: TIA Portal, Simatic Manager, STEP 5 and others."],[],["We provide development, integration and supply of control systems for your production units."]],
[["We assemble automation control panels and cabinets, including for ventilation and air conditioning, boiler rooms, pumping stations and power supply systems. The panels include alarm systems and systems that warn of abnormal situations."],["Specification and component selection","Installation and commissioning","Help with passing inspections by regulators","Warranty and post-warranty service","Supply of all components at an optimal price"],["We work closely with the customer and take all wishes into account."]],
[["When production capacity is renewed or redistributed, equipment must be dismantled safely and within budget. We decide how deep the dismantling should go, taking into account transport and commissioning deadlines."],["We plan the sequence of operations to reduce downtime","We mark units, cables and pipeline elements","We pack elements for transport or storage","We follow safety standards"],[]],
[["Inspection is a set of operations to determine the wear of equipment or its parts and to check performance, safety and reliability of units and components.","Periodic inspection and tuning of equipment, drives and automation keeps your production running, helps detect faults in time and significantly extends service life."],[],[]],
[["Modernization means changes and improvements that raise performance, accuracy, safety and ease of maintenance. It extends the life of old machines when buying new ones is not affordable. It can cover mechanics, pneumatics, hydraulics and the automatic control system.","We offer a comprehensive approach or modernization of individual elements: we develop a new control system or upgrade the existing one on modern hardware."],[],[]],
[["We specialize in component-level repair: restoring boards damaged by corrosion, mechanical or thermal impact, replacing discrete elements, chips, fans and transformers. We repair frequency converters, servo drives, controllers, control panels and power supplies."],["IGBT and rectifier module replacement and restoration","Restoration of control channels","Cleaning of units with full disassembly","Parameterization, restoring working settings","Commissioning","Restoring tracks and vias"],["Authorized service partner of Danfoss, WEG, Vacon, Omron in Russia and Siemens, Schneider Electric in Turkey. We work with legal entities only."]]
],
uz:[
[["Sanoat uskunalarini montaj qilish — turli texnikani yig‘ish, o‘rnatish va ulashni birlashtiruvchi ishlar majmuasi. Ustalarimiz alohida qurilmalarni ham, to‘liq texnologik liniyalarni ham o‘rnata oladi, ishga tushirish-sozlash va keyingi xizmat ko‘rsatishni bajaradi.","Montaj jarayoni bir necha bosqichdan iborat: uskunani joylashtirish, simlarni o‘rnatish va ulash, elektr komponentlarni ulash, dasturiy ta’minotni o‘rnatish, parametrlarni sozlash va agregatlar ishlashini tekshirish.","Tajribali mutaxassislarimiz uskunangizni o‘z vaqtida va sifatli montaj qilib, sozlab beradi.","Shuningdek:"],["Belgilangan muddatda texnologik mahsulotlar","Tadqiqotlar o‘tkazish","Teskari injiniring","Uskunangiz ma’lumotlarini yig‘ish va tahlil qilishda yordam","G‘oya yoki mahsulotingizni muhokama qilamiz","Nimani qilmaslik kerakligini maslahat beramiz","Oqilona byudjet bilan yuqori yuklangan ishlab chiqarishni qanday yaratishni aytib beramiz","Loyiha tugagandan keyin ham doim aloqadamiz","Savollaringizga juda tez javob beramiz","Bizda katta tajriba va ko‘plab ishlanmalar bor."],[]],
[["Sanoat sohasi ayniqsa yaxshi dasturchilarga muhtoj: zavodlarda ko‘plab mashinalar, qurilmalar, nasoslar va quvurlar bor, ularning barchasi uchun boshqaruv va xavfsizlik nazorati tizimlari kerak. Operator bitta tugmani bosib, minglab datchiklardan ma’lumot oladi.","Asosiy tajribamiz SIEMENS va OMRON kontrollerlari bilan, shuningdek DELTA, OWEN, GMT, ABB, SCHNEIDER ELECTRIC, DANFOSS, MITSUBISHI ELECTRIC bilan ham ishlaganmiz. Dasturni noldan yoki mavjud proshivkalar asosida yozamiz, HMI loyihalaymiz. Sinov uchun stend (64 raqamli kirish, 64 chiqish, 16 analog kanal) va litsenziyalangan dastur: TIA Portal, Simatic Manager, STEP 5 va boshqalardan foydalanamiz."],[],["Texnologik qurilmalaringiz uchun boshqaruv tizimlarini ishlab chiqish, integratsiya va yetkazib berish xizmatlarini taklif qilamiz."]],
[["Avtomatika boshqaruv shit va shkaflarini yig‘amiz, jumladan ventilyatsiya va konditsionerlash, qozonxona, nasos stansiyalari va elektr ta’minoti tizimlari uchun. Shitlarga avariya signalizatsiyasi va favqulodda holatlar haqida ogohlantiruvchi tizimlar o‘rnatiladi."],["Texnik topshiriq va butlovchi qismlarni tanlash","Montaj va ishga tushirish-sozlash ishlari","Nazorat organlariga topshirishda yordam","Kafolat va kafolatdan keyingi xizmat","Barcha komponentlarni maqbul narxda yetkazib berish"],["Buyurtmachi bilan yaqin hamkorlikda ishlaymiz va barcha istaklarini inobatga olamiz."]],
[["Ishlab chiqarish quvvatlari yangilanganda yoki qayta taqsimlanganda uskunani xavfsiz va byudjetni oshirmasdan demontaj qilish kerak. Demontaj chuqurligini tashish va quvvatlarni ishga tushirish muddatlarini hisobga olib belgilaymiz."],["Ishlab chiqarish to‘xtab qolishini kamaytirish uchun amallar ketma-ketligini rejalashtiramiz","Uzellar, kabellar va quvur elementlarini markalaymiz","Elementlarni tashish yoki konservatsiya uchun qadoqlaymiz","Xavfsizlik standartlariga rioya qilamiz"],[]],
[["Reviziya — uskuna yoki uning qismlarining eskirish darajasini aniqlash, ishlash qobiliyati, xavfsizligi va uzellar ishonchliligini tekshirish bo‘yicha ishlar majmuasi.","Uskuna, elektr yuritma va avtomatikani davriy tekshirish va sozlash ishlab chiqarishingiz uzluksizligini ta’minlaydi, nosozliklarni o‘z vaqtida aniqlashga yordam beradi va xizmat muddatini sezilarli uzaytiradi."],[],[]],
[["Modernizatsiya — unumdorlik, aniqlik, xavfsizlik va xizmat ko‘rsatish qulayligini oshiradigan o‘zgarish va takomillashtirishlar. Yangi uskuna sotib olish imkoni bo‘lmaganda eski stanokning umrini uzaytiradi. Mexanika, pnevmo- va gidrotizimlar hamda avtomatik boshqaruv tizimiga tatbiq etilishi mumkin.","Kompleks yondashuvni yoki alohida elementlarni modernizatsiya qilishni taklif qilamiz: yangi boshqaruv tizimini ishlab chiqamiz yoki mavjudini zamonaviy uskunada takomillashtiramiz."],[],[]],
[["Komponent darajasidagi ta’mirga ixtisoslashganmiz: korroziya, mexanik va termik ta’sirdan zarar ko‘rgan platalarni tiklash, diskret elementlar, mikrosxemalar, ventilyatorlar va transformatorlarni almashtirish. Chastota o‘zgartirgichlar, servoyuritmalar, kontrollerlar, boshqaruv panellari va quvvat bloklarini ta’mirlaymiz."],["IGBT va to‘g‘rilagich modullarini almashtirish va tiklash","Boshqaruv kanallarini tiklash","Uzel va bloklarni to‘liq qismlarga ajratib tozalash","Parametrlash, ish sozlamalarini tiklash","Ishga tushirish-sozlash","Yo‘lakchalar va o‘tish teshiklarini tiklash"],["Rossiyada Danfoss, WEG, Vacon, Omron va Turkiyada Siemens, Schneider Electric vakolatli servis hamkoriimiz. Faqat yuridik shaxslar bilan ishlaymiz."]]
]};
